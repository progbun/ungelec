name: Refresh sitemap and llms.txt

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Regenerate sitemap.xml
        run: python scripts/gen_sitemap.py
      - name: Regenerate llms.txt
        run: python scripts/gen_llms.py
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml llms.txt llms-full.txt
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: auto-refresh sitemap and llms.txt"
            git push
          fi